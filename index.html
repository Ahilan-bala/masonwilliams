<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A short description of this page for search engines and social previews." />
  <title>Route Builder</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>Route Builder</h1>
    <p id="hint"></p>
  </header>

  <div class="toolbar">
    <button id="btn-move" class="active">Move</button>
    <button id="btn-draw" class="btn-draw">Draw Route</button>
    <button id="btn-undo" class="btn-undo">Undo Point</button>
    <button id="btn-clear" class="btn-clear">Clear Route</button>
    <input id="play-name" placeholder="Play name" />
    <button id="btn-save">Save</button>
    <select id="play-list"></select>
    <button id="btn-load">Load</button>
    <button id="btn-delete">Delete</button>
    <select id="pos-select">
      <option>QB</option>
      <option>RB</option>
      <option>WR</option>
      <option>TE</option>
      <option>OL</option>
      <option>CB</option>
      <option>S</option>
      <option>LB</option>
      <option>DL</option>
    </select>
    <button id="btn-add">Add player</button>
    <button id="btn-remove">Remove selected</button>
  </div>

  <svg id="field" viewBox="0 0 53.3 30" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0 0  L10 5 L0 10 z" fill="#ffd400" />
      </marker>
    </defs>

    <g id="turf"></g>
    <g id="lines"></g>
    <g id="routes"></g>
    <g id="waypoints"></g>
    <g id="players"></g>



  </svg>

  <script src="app.js"></script>

</body>

</html>
